name: continuous integration
on:
  push:
    branches:
      - main
      - dev/*
      - Dev/*
  pull_request:
    branches:
      - main

env:
  github_username: seralyne
  github_password: ${{ secrets.GITHUB_TOKEN }}
  GIT_COMMIT: ${{ github.sha }}


jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4        
      - name: Set up go
        uses: actions/setup-go@v7
        with: 
          go-version: '1.21'
      - name: Build backend
        working-directory: ./backend
        run: go build
      - name: Build frontend
        working-directory: ./frontend
        run: go build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code
          path: .

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Download Code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Test frontend
        working-directory: ./frontend
        run: go test

  Docker-Image:
    runs-on: ubuntu-latest
    needs: Testing
    permissions:
      packages: write
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Build Docker
        run: bash ci/build-docker.sh
      - name: Push Docker
        run: bash ci/push-docker.sh

  Deploy:
    runs-on: ubuntu-latest
    needs: Docker-Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Persist kubeconfig and deploy
        run: |
              echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
              kubectl --kubeconfig kubeconfig apply -f kubernetes/manifest_backend.yaml -f kubernetes/manifest_frontend.yaml -f kubernetes/redis.yaml
              
              echo "✅ Deployment successful!"
  Smoke-Test:
    runs-on: ubuntu-latest
    needs: Deploy
    steps: 
      - name: Run Smoke Test Script
        run: ci/test-endpoint.sh
