name: continuous integration
on:
  push:
    branches:
      - main
      - dev/*
      - Dev/*
  pull_request:
    branches:
      - main

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4        
      - name: Set up go
        uses: actions/setup-go@v7
        with: 
          go-version: '1.21'
      - name: Build backend
        working-directory: ./backend
        run: go build
      - name: Build frontend
        working-directory: ./frontend
        run: go build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code
          path: .
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Download Code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Test frontend
        working-directory: ./frontend
        run: go test
